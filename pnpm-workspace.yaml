ignoreWorkspaceRootCheck: true
shellEmulator: true

catalogs:
  cli:
    '@antfu/eslint-config': ^5.4.1
    '@antfu/ni': ^26.0.1
    bumpp: ^10.2.3
    eslint: ^9.36.0
    lint-staged: ^16.2.0
    simple-git-hooks: ^2.13.1
    tsdown: ^0.15.4
    tsx: ^4.20.5
    typescript: ^5.9.2
    vite: ^7.1.7
  inlined:
    '@antfu/utils': ^9.2.1
  prod:
    '@hono/node-server': ^2.1.6
    '@hono/standard-validator': ^0.4.1
    '@langchain/core': ^1.3.4
    '@langchain/langgraph': ^1.7.0
    '@standard-schema/spec': ^1.0.0
    hono: ^4.13.16
    openai: ^7.52.0
    zod: ^4.6.7
  testing:
    tinyexec: ^1.0.1
    vitest: ^3.2.4
